[package]
name = "o3c"
version = "0.1.0"
edition = "2021"

[dependencies]
o3c-proto = { path = "../proto" }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
strip = true
